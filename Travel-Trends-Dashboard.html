<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Travel-Trends-Dashboard · Portfolio</title>
  <meta name="description" content="A modern portfolio case study presenting a code-first travel trends dashboard." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f6f3ee;
      --surface: #fffdf9;
      --surface-2: #f0ebe3;
      --line: #ddd4c8;
      --text: #223039;
      --muted: #697983;
      --faint: #93a0a8;
      --primary: #1e4e60;
      --primary-2: #2f6a7d;
      --accent: #c97c63;
      --accent-soft: #f3e1d9;
      --radius-lg: 28px;
      --radius-md: 20px;
      --shadow-sm: 0 8px 22px rgba(28, 37, 43, 0.05);
      --shadow-lg: 0 18px 48px rgba(28, 37, 43, 0.08);
      --content: 1180px;
    }

    [data-theme="dark"] {
      --bg: #121517;
      --surface: #1c2022;
      --surface-2: #24292c;
      --line: #31383d;
      --text: #edf0f1;
      --muted: #a5b0b6;
      --faint: #7e8a91;
      --primary: #7fb3c7;
      --primary-2: #99c5d6;
      --accent: #dc9b86;
      --accent-soft: #392d2a;
      --shadow-sm: 0 10px 24px rgba(0, 0, 0, 0.25);
      --shadow-lg: 0 18px 48px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: 'Manrope', system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 0% 0%, rgba(30,78,96,0.07), transparent 24%),
        radial-gradient(circle at 100% 0%, rgba(201,124,99,0.10), transparent 28%),
        var(--bg);
      line-height: 1.6;
    }

    img, svg { display: block; max-width: 100%; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; }

    .container {
      width: min(var(--content), calc(100% - 2rem));
      margin-inline: auto;
    }

    .skip-link {
      position: absolute;
      left: -999px;
      top: 0;
    }

    .skip-link:focus {
      left: 1rem;
      top: 1rem;
      z-index: 999;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.75rem 1rem;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(14px);
      background: color-mix(in srgb, var(--bg) 86%, transparent);
      border-bottom: 1px solid color-mix(in srgb, var(--line) 82%, transparent);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 0;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.85rem;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      box-shadow: var(--shadow-sm);
      position: relative;
      overflow: hidden;
    }

    .brand-mark::before,
    .brand-mark::after {
      content: "";
      position: absolute;
      border-radius: 999px;
      background: rgba(255,255,255,0.42);
    }

    .brand-mark::before {
      width: 22px;
      height: 3px;
      left: 8px;
      top: 12px;
      transform: rotate(-35deg);
    }

    .brand-mark::after {
      width: 14px;
      height: 3px;
      left: 16px;
      top: 22px;
      transform: rotate(45deg);
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 1rem;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .nav a:hover { color: var(--text); }

    .theme-toggle {
      width: 44px;
      height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
    }

    .hero {
      padding: 5.5rem 0 3rem;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 2rem;
      align-items: center;
    }

    .eyebrow {
      margin: 0 0 1rem;
      font-size: 0.78rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    h1, h2, h3 { margin: 0; line-height: 1.05; letter-spacing: -0.045em; }

    h1 {
      font-size: clamp(3.2rem, 7vw, 6.6rem);
      max-width: 9.5ch;
    }

    h1 em,
    .section-title em {
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-weight: 400;
      color: var(--accent);
    }

    .hero-copy p {
      margin: 1.25rem 0 0;
      max-width: 60ch;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .hero-card,
    .panel,
    .project-card,
    .chart-card,
    .note-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
    }

    .hero-card {
      padding: 1.5rem;
      display: grid;
      gap: 1rem;
    }

    .mini-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .mini-item {
      padding: 1rem;
      border-radius: var(--radius-md);
      background: color-mix(in srgb, var(--surface) 72%, var(--surface-2));
      border: 1px solid var(--line);
    }

    .mini-item span {
      display: block;
      color: var(--faint);
      font-size: 0.76rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 0.4rem;
    }

    .mini-item strong {
      font-size: 1rem;
      letter-spacing: -0.03em;
    }

    .button-row,
    .action-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.85rem;
      margin-top: 1.8rem;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      min-height: 48px;
      padding: 0.9rem 1.2rem;
      border-radius: 999px;
      font-weight: 600;
      border: 1px solid transparent;
      transition: transform 160ms ease, background 160ms ease, border-color 160ms ease;
    }

    .button:hover { transform: translateY(-1px); }
    .button.primary { background: var(--primary); color: white; }
    .button.secondary { background: var(--surface); border-color: var(--line); color: var(--text); }
    .button.ghost { background: transparent; border-color: var(--line); color: var(--muted); }

    .section {
      padding: 1.5rem 0 4.5rem;
    }

    .section-head {
      display: grid;
      grid-template-columns: 0.8fr 1.2fr;
      gap: 2rem;
      align-items: end;
      margin-bottom: 1.4rem;
    }

    .section-head p {
      margin: 0;
      color: var(--muted);
      max-width: 58ch;
    }

    .section-title {
      font-size: clamp(2rem, 4vw, 3.4rem);
    }

    .projects-grid,
    .split-grid,
    .insight-grid {
      display: grid;
      gap: 1.2rem;
    }

    .projects-grid {
      grid-template-columns: 1.25fr 0.75fr;
    }

    .split-grid {
      grid-template-columns: 1fr 1fr;
    }

    .insight-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .project-card {
      overflow: hidden;
    }

    .project-visual {
      min-height: 320px;
      padding: 1.5rem;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.02)),
        linear-gradient(135deg, color-mix(in srgb, var(--primary) 14%, var(--surface-2)), var(--surface));
      border-bottom: 1px solid var(--line);
      display: grid;
      align-content: space-between;
      position: relative;
    }

    .project-visual::after {
      content: "Replace with exported chart preview or screenshot";
      position: absolute;
      right: 1rem;
      bottom: 1rem;
      font-size: 0.82rem;
      color: var(--faint);
    }

    .fake-chart-lines,
    .fake-chart-bars {
      display: grid;
      gap: 0.8rem;
    }

    .fake-chart-lines div {
      height: 3px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--primary), transparent 70%);
    }

    .fake-chart-bars div {
      height: 42px;
      border-radius: 14px;
      background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 38%,
